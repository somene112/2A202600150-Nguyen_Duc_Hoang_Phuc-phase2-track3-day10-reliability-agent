[project]
name = "day10-reliability-agent-lab"
version = "0.1.0"
description = "Production-style skeleton for LLM agent reliability: circuit breakers, caching, metrics, and chaos testing."
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7,<3.0",
  "pyyaml>=6.0,<7.0",
  "numpy>=1.26,<3.0",
  "rich>=13.7,<15.0",
  "redis>=5.0,<6.0",
  "prometheus_client>=0.20,<1.0",
  "fastapi>=0.110,<1.0",
  "uvicorn>=0.29,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<10.0",
  "pytest-cov>=5.0,<8.0",
  "ruff>=0.5,<1.0",
  "mypy>=1.10,<2.0",
  "hypothesis>=6.0,<7.0",
  "types-PyYAML>=6.0,<7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["todo: tests that should pass after students implement TODOs"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["prometheus_client", "prometheus_client.*"]
ignore_missing_imports = true
