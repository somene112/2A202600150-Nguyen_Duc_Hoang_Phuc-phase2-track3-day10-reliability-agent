providers:
  - name: primary
    fail_rate: 0.25
    base_latency_ms: 180
    cost_per_1k_tokens: 0.01
  - name: backup
    fail_rate: 0.05
    base_latency_ms: 260
    cost_per_1k_tokens: 0.006
circuit_breaker:
  failure_threshold: 3
  reset_timeout_seconds: 2
  success_threshold: 1
cache:
  enabled: true
  backend: memory          # "memory" (default) or "redis" (requires docker compose up -d)
  ttl_seconds: 300
  similarity_threshold: 0.92
  redis_url: "redis://localhost:6379/0"
load_test:
  requests: 200
  concurrency: 10

# Chaos scenarios: each overrides provider fail_rate for targeted testing.
scenarios:
  - name: primary_timeout_100
    description: "Primary provider fails 100% — all traffic should fallback to backup"
    provider_overrides:
      primary: 1.0

  - name: primary_flaky_50
    description: "Primary provider fails 50% — circuit should oscillate, backup handles overflow"
    provider_overrides:
      primary: 0.5

  - name: all_healthy
    description: "Baseline - both providers forced healthy (fail_rate=0)"
    provider_overrides:
      primary: 0.0
      backup: 0.0

  - name: recovery_cycle
    description: "Primary flaky (80%) with cache disabled — circuit must open, probe, and close"
    disable_cache: true
    provider_overrides:
      primary: 0.8

  - name: cache_stale_candidate
    description: "Year-sensitive queries (2023/2024/2025/2026) must not produce false cache hits"
    provider_overrides: {}

  - name: backup_also_flaky
    description: "Both providers degraded — static fallback expected, but error_rate <= 70%"
    disable_cache: true
    provider_overrides:
      primary: 1.0
      backup: 0.5

  - name: cost_cap_scenario
    description: "Tight $0.005 budget triggers cost_cap_skips on expensive primary provider"
    disable_cache: true
    cost_budget_usd: 0.005
    provider_overrides: {}
